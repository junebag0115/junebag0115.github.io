<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><title>Queens Ballpark</title></head><body style="background:#102b46;color:white;font:18px sans-serif;padding:24px"><p id="message">Opening your ballpark…</p><script>
(async()=>{try{const root=new URL('../../',location.href);const response=await fetch(root.href,{cache:'no-cache'});if(!response.ok)throw new Error('Connect to the internet for the first launch.');const html=await response.text();document.open();document.write(html.replace(/<head([^>]*)>/i,'<head$1><base href="'+root.href+'">'));document.close();}catch(error){document.getElementById('message').textContent='Connect to the internet, open the game and choose Save Offline before travelling.';}})();
</script></body></html>
